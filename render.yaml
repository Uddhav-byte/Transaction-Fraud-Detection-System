# render.yaml — Render deployment configuration
services:
  - type: web
    name: fraud-detection-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python src/train.py
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    plan: free
